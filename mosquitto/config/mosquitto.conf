# Zgnis Solar — Mosquitto config
#
# Auth/ACLs are handled entirely by the dynamic-security ("dynsec")
# plugin, not the old static password_file/acl_file. Credentials are
# provisioned automatically by the API (internal/mqttadmin) whenever a
# device is registered/rotated/revoked, or the ingestor's own service
# account is bootstrapped — no manual `mosquitto_passwd`/ACL editing or
# broker restart needed for any of that anymore.
#
# The very first admin credential is set via MOSQUITTO_DYNSEC_PASSWORD
# (see docker-compose.yml / .env) on the container's first-ever start —
# after that, the plugin persists its own state in
# dynamic-security.json in this same directory (gitignored: it holds
# every device's hashed broker credential).

listener 1883
protocol mqtt

allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# TLS listener — Phase 4. Certs here are generated by
# scripts/gen-dev-certs.sh for LOCAL VERIFICATION ONLY (self-signed, not
# trusted by any real device or browser). Before any device connects over
# public internet, replace these with a real CA-issued cert for a real
# hostname — see docs/tls.md. Run gen-dev-certs.sh before restarting
# Mosquitto with this listener active, or it will fail to start.
listener 8883
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false
