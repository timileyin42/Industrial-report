# Zgnis Solar — Mosquitto config (Phase 0 / local dev)
#
# Auth: every device must have its own username/password entry in passwd_file.
# Generate with: docker exec zgnis-mosquitto mosquitto_passwd -b /mosquitto/config/passwd ZG-0001 <secret>
# (creates the file on first run if it doesn't exist — use -c only for the very first entry)

listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# TLS listener — enable before any device connects over public internet.
# Left commented for Phase 0 local dev since it needs real certs.
# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false
