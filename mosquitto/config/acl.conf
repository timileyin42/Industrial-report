# Per-device topic isolation.
#
# This is the piece that stops a leaked credential for one device from
# being able to publish fake data for every other site. Never remove or
# loosen this to "user X can publish to devices/#" — that defeats the point.
#
# Pattern substitution: %u = the authenticated username (must equal device_id).
# Every device's username in the password file MUST match its device_id
# exactly for this to work.

pattern write devices/%u/telemetry
pattern read devices/%u/telemetry

# The ingestor service connects with its own dedicated credential
# (add to passwd file as e.g. "ingestor-service") and needs read access
# to all device topics — nothing else.
user ingestor-service
topic read devices/+/telemetry
