server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based responses at the origin — helps even on a
    # Cloudflare cache miss (edge-to-origin) and for any client Cloudflare
    # doesn't compress for. gzip_static would need pre-built .gz files at
    # build time; on-the-fly gzip here is simpler and cheap for a SPA's
    # bundle sizes.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml font/ttf font/otf;

    # React Router (client-side routing) — any unmatched path falls back
    # to index.html so the app's own router handles it, not a 404 page.
    # index.html itself must never be cached long — it's the shell that
    # references the current build's hashed asset filenames; caching it
    # aggressively (or letting Cloudflare's default heuristics do so)
    # would mean a deploy never actually reaches a returning visitor
    # until their cache expires, serving old JS/CSS references (or a
    # blank/broken page if an old asset was pruned). no-cache still
    # allows browsers/Cloudflare to revalidate cheaply (a 304 on no
    # change), it just forces that check every time rather than serving
    # a stale copy blind.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
